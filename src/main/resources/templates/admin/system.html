<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>システム管理 | 工程ノート</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap"
		rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

	<header class="site-header">
		<div class="container">
			<a href="/admin/dashboard" class="brand">
				<span class="brand-mark">Kotei</span>
				<span class="brand-sub">工程ノート 管理者</span>
			</a>
			<nav class="nav-actions">
				<a href="/admin/dashboard" class="btn btn-ghost">ダッシュボード</a>
				<form class="logout-form" th:action="@{/logout}" method="post">
					<button type="submit" class="btn btn-ghost">ログアウト</button>
				</form>
			</nav>
		</div>
	</header>

	<main class="app-main">
		<div class="container">

			<div class="page-header">
				<div>
					<p class="eyebrow">Admin / System</p>
					<h1>システム管理</h1>
				</div>
			</div>

			<div class="detail-meta">
				<div class="meta-item">
					<span class="meta-label">総ユーザー数</span>
					<span th:text="${totalUsers} + '人'"></span>
				</div>
				<div class="meta-item">
					<span class="meta-label">総チーム数</span>
					<span th:text="${totalTeams} + '件'"></span>
				</div>
			</div>

			<div th:if="${settingsSuccess}" class="banner banner-success" th:text="${settingsSuccess}"></div>
			<div th:if="${settingsError}" class="banner banner-error" th:text="${settingsError}"></div>

			<div class="settings-grid">

				<div class="panel">
					<div class="panel-head">
						<h2>アプリケーション設定</h2>
					</div>
					<form th:action="@{/admin/system/settings}" method="post" class="settings-form">
						<div class="form-field form-field-checkbox">
							<label class="checkbox-label">
								<input type="checkbox" name="maintenanceMode" value="true" th:checked="${settings.maintenanceMode}">
								<span>メンテナンスモードを有効にする</span>
							</label>
							<p class="field-hint">有効にすると、管理者以外はサービスを利用できなくなります。</p>
						</div>
						<div class="form-field">
							<label for="announcementMessage">全体お知らせメッセージ</label>
							<textarea id="announcementMessage" name="announcementMessage" rows="3" th:text="${settings.announcementMessage}" placeholder="全ユーザーに表示するお知らせを入力"></textarea>
						</div>
						<div class="form-field">
							<label for="backupFrequency">自動バックアップ頻度</label>
							<select id="backupFrequency" name="backupFrequency">
								<option value="DAILY" th:selected="${settings.backupFrequency == 'DAILY'}">毎日</option>
								<option value="WEEKLY" th:selected="${settings.backupFrequency == 'WEEKLY'}">毎週</option>
								<option value="MONTHLY" th:selected="${settings.backupFrequency == 'MONTHLY'}">毎月</option>
							</select>
						</div>
						<div class="form-actions">
							<button type="submit" class="btn btn-primary">設定を保存</button>
						</div>
					</form>
				</div>

				<div class="panel">
					<div class="panel-head">
						<h2>バックアップ</h2>
					</div>
					<div class="backup-status">
						<span class="meta-label">最終バックアップ日時</span>
						<span class="backup-timestamp" th:text="${settings.lastBackupAt != null} ? ${#temporals.format(settings.lastBackupAt, 'yyyy-MM-dd HH:mm')} : '未実行'"></span>
					</div>
					<form th:action="@{/admin/system/backup}" method="post">
						<button type="submit" class="btn btn-ghost">今すぐバックアップを実行</button>
					</form>
				</div>

			</div>

		</div>
	</main>

	<footer class="site-footer">
		<div class="container">
			<p>&copy; 2026 工程ノート</p>
		</div>
	</footer>

</body>

</html>
